[project]
name = "logomaker"
version = "0.1.0"
description = "Constructed-vector logo generator CLI for the Claude Code logo skill"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "coloraide>=8.0",
    "fonttools>=4.66",
    "httpx>=0.28",
    "jinja2>=3.1",
    "numpy>=2.0",
    "pillow>=12.0",
    "playwright>=1.63",
    "pydantic>=2.8",
    "pypdf>=6.0",
    "reportlab>=4.0",
    "scipy>=1.14",
    "skia-python>=144.0",
    "uharfbuzz>=0.50",
]

[project.scripts]
logomaker = "logomaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/logomaker"]

[tool.logomaker]
root = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Concept modules start with `from logomaker.kit import *`: the star import is their contract (spec section 6.3).
"tests/fixtures/concepts/*/concept.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: renders through the installed Google Chrome (skipped when Chrome is missing)",
    "live: needs the network (font fetch, RDAP); kept out of the fast suite",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]
