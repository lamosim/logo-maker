<div class="mockup" data-mockup="{{ kind }}" style="width:300px;height:380px;border-radius:28px;background:linear-gradient(160deg,#1c2541,#3a506b);padding:28px 18px;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,60px);gap:14px 12px;justify-content:center;align-content:start">
  {% for n in neighbours[:5] %}<div style="width:60px;height:60px">{{ n|safe }}</div>{% endfor %}
  <div style="width:60px;height:60px;border-radius:14px;background:{{ tile_fill }};display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px rgba(255,255,255,.35)">{{ icon_svg|safe }}</div>
  {% for n in neighbours[5:] %}<div style="width:60px;height:60px">{{ n|safe }}</div>{% endfor %}
</div>
