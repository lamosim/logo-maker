<div class="mockup" data-mockup="{{ kind }}" style="width:360px;background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:14px;box-sizing:border-box;font:13px -apple-system,Helvetica,Arial,sans-serif;color:#222">
  <div style="display:flex;gap:12px;align-items:center">
    <div style="width:80px;height:80px;border-radius:50%;background:{{ paper_light }};border:1px solid #ddd;display:flex;align-items:center;justify-content:center;overflow:hidden">{{ avatar_svg|safe }}</div>
    <div><b>{{ brand }}</b><div style="color:#777">@{{ handle }}</div></div>
  </div>
  <div style="margin-top:10px;color:#555;line-height:1.4">We just shipped the thing we promised. Here is what changed and why it matters to you.</div>
</div>
